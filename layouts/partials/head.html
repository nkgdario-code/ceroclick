<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}Ceroclick — Automatización y Productividad{{ else }}{{ .Title }} | Ceroclick{{ end }}</title>
<meta name="description" content="{{ if .Params.description }}{{ .Params.description }}{{ else }}Automatización, herramientas y productividad. Tutoriales, guías y consejos para automatizar tu trabajo y ganar tiempo.{{ end }}">
<meta name="author" content="Ceroclick">
<link rel="canonical" href="{{ .Permalink }}">

<!-- Open Graph -->
<meta property="og:title" content="{{ if .IsHome }}Ceroclick — Automatización y Productividad{{ else }}{{ .Title }}{{ end }}">
<meta property="og:description" content="{{ if .Params.description }}{{ .Params.description }}{{ else }}Automatización, herramientas y productividad para trabajar menos y producir más.{{ end }}">
<meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="https://ceroclick.es/images/og-image.png">
<meta property="og:site_name" content="Ceroclick">
<meta property="og:locale" content="es_ES">
{{ if not .IsHome }}
<meta property="article:published_time" content="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">
<meta property="article:modified_time" content="{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}">
{{ range .Params.tags }}<meta property="article:tag" content="{{ . }}">{{ end }}
{{ end }}

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
<link rel="alternate icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/images/og-image.png">

<link rel="alternate" type="application/rss+xml" title="Ceroclick RSS" href="/index.xml">

<link rel="stylesheet" href="/css/style.css">

{{ if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Ceroclick",
  "url": "https://ceroclick.es",
  "logo": "https://ceroclick.es/images/og-image.png",
  "description": "Automatización, herramientas y productividad. Tutoriales, guías y consejos para automatizar tu trabajo y ganar tiempo.",
  "sameAs": [
    "https://github.com/ceroclick"
  ]
}
</script>
{{ end }}

{{ if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Ceroclick",
  "url": "https://ceroclick.es",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "https://ceroclick.es/search/?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>
{{ end }}

{{ if .Params.tags }}
<meta name="keywords" content="{{ delimit .Params.tags ", " }}">
{{ end }}

{{ if not .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ .Title }}",
  "description": "{{ .Summary | plainify }}",
  "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
  "author": {"@type": "Person", "name": "Ceroclick"},
  "publisher": {"@type": "Organization", "name": "Ceroclick", "logo": {"@type": "ImageObject", "url": "https://ceroclick.es/images/og-image.png"}},
  "mainEntityOfPage": {"@type": "WebPage", "@id": "{{ .Permalink }}"},
  "image": "https://ceroclick.es/images/og-image.png"{{ if .Params.tags }},
  "keywords": [{{ range $i, $t := .Params.tags }}{{ if $i }}, {{ end }}"{{ $t }}"{{ end }}]{{ end }}
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [{
    "@type": "ListItem",
    "position": 1,
    "name": "Inicio",
    "item": "https://ceroclick.es"
  },{
    "@type": "ListItem",
    "position": 2,
    "name": "Artículos",
    "item": "https://ceroclick.es/posts/"
  },{
    "@type": "ListItem",
    "position": 3,
    "name": "{{ .Title }}",
    "item": "{{ .Permalink }}"
  }]
}
</script>
{{ end }}
