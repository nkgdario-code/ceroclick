{{ define "main" }}
<nav class="breadcrumbs" aria-label="Migas de pan">
  <a href="/">Inicio</a>
  <span class="separator">›</span>
  <span class="current">Artículos</span>
</nav>

<div class="list-page">
  <h1>{{ .Title }}</h1>
  <p class="list-description">{{ .Description }}</p>

  <div class="posts-list">
    {{ range .Pages }}
    <article class="post-item">
      <div class="post-meta">
        <time>{{ .Date.Format "02/01/2006" }}</time>
        {{ if .Params.tags }}
        <div class="tags">
          {{ range .Params.tags }}<span class="tag">#{{ . }}</span>{{ end }}
        </div>
        {{ end }}
      </div>
      <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
      <p>{{ .Summary }}</p>
      <a href="{{ .Permalink }}" class="read-more">Leer más →</a>
    </article>
    {{ end }}
  </div>
</div>
{{ end }}
